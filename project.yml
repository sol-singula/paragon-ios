name: Paragon

options:
  bundleIdPrefix: net.solbuild
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  TwilioVoice:
    url: https://github.com/twilio/twilio-voice-ios
    # Pinned: 6.13.8's static binary fails to download in SwiftPM
    # ("already exists in file system"), which stops every build.
    exactVersion: 6.13.7

targets:
  Paragon:
    type: application
    platform: iOS

    sources:
      - path: Paragon

    dependencies:
      - package: Supabase
        product: Supabase
      - package: TwilioVoice
        product: TwilioVoice
      - sdk: CallKit.framework
      - sdk: PushKit.framework

    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig

    entitlements:
      path: Paragon/Paragon.entitlements
      properties:
        # Xcode turns this into "production" when the app is archived for
        # TestFlight or the App Store. A debug build's tokens are sandbox ones,
        # and the app tells the server which (PushManager.apnsEnv).
        aps-environment: development
        # A missed call and a reply clock running out break through Focus.
        com.apple.developer.usernotifications.time-sensitive: true

    info:
      path: Paragon/Info.plist
      properties:
        CFBundleDisplayName: Paragon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false

        # Values come from Config/Secrets.xcconfig at build time.
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)

        NSMicrophoneUsageDescription:
          Paragon uses the microphone when you answer or place a call.
        # voip: a call rings the phone through PushKit and CallKit, even
        # locked or with the app closed. audio: the call keeps going when the
        # screen locks. remote-notification: texts and missed calls.
        UIBackgroundModes:
          - audio
          - voip
          - remote-notification

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.solbuild.paragon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # TwilioVoice ships no Intel simulator slice: simulators run arm64
        # (an Apple-silicon Mac). Phones are arm64 anyway.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
