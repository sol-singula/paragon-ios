name: Build

# Compiles the app for the simulator on every push, unsigned, so a change
# that doesn't build is caught before anyone opens Xcode. It never signs,
# archives or uploads anything. On main, once it builds, it commits the
# regenerated Paragon.xcodeproj, so the repo is always an Xcode project you
# open as it is (project.yml is where targets and settings are changed).
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen && xcodegen generate
      - name: Packages
        # GitHub's release downloads (TwilioVoice's binaries) sometimes fail
        # part way; SwiftPM then reports "already exists in file system".
        # Resolve on its own with a fresh cache, a few tries.
        run: |
          for i in 1 2 3 4; do
            rm -rf ~/Library/Caches/org.swift.swiftpm "$RUNNER_TEMP/spm" "$RUNNER_TEMP/spm-src"
            if xcodebuild -resolvePackageDependencies -project Paragon.xcodeproj -scheme Paragon \
                 -packageCachePath "$RUNNER_TEMP/spm" -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-src" \
                 -skipPackagePluginValidation -skipMacroValidation; then exit 0; fi
            curl -sSL -o /dev/null -w "twilio zip: %{http_code} %{size_download} bytes\n" \
              https://github.com/twilio/twilio-voice-ios/releases/download/6.13.8/TwilioVoice-static.xcframework.zip || true
            sleep 30
          done
          exit 1
      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild -project Paragon.xcodeproj -scheme Paragon -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -packageCachePath "$RUNNER_TEMP/spm" -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-src" \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|ld: |Undefined symbol|not found|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Errors
        if: failure()
        run: |
          grep -n -B2 -A12 -E "error:|Undefined symbols|ld: " build.log | head -150 || true
      - name: Commit the Xcode project
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Paragon.xcodeproj Paragon/Info.plist Paragon/Paragon.entitlements
          if git diff --cached --quiet; then echo "project unchanged"; exit 0; fi
          git commit -m "Xcode project regenerated from project.yml [skip ci]"
          git push origin HEAD:main
